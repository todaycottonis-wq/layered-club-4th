<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Layered Club 히어로 4:5</title>
<link rel="stylesheet" href="../fonts/pretendard/pretendardvariable-dynamic-subset.css">
<style>
/* 사이트 첫 화면(히어로)을 인스타 4:5(1080×1350)로 옮긴 틀. 글씨는 키우고 간격을 넓혀서 세로 화면에 맞췄어요. */
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;color:#111;letter-spacing:-.02em;word-break:keep-all;-webkit-font-smoothing:antialiased}
#stage{width:1080px;height:1350px;position:relative;overflow:hidden;background:#fff;text-align:center}
.txt{position:absolute;left:0;right:0;top:118px;padding:0 60px}
h1{font-size:152px;line-height:1.05;font-weight:600;letter-spacing:-.06em;margin:0;white-space:nowrap}
h1 span{background:linear-gradient(#e0ffba,#e0ffba) no-repeat 0 90%;background-size:100% 36%;padding:0 6px}
.motto{font-size:42px;font-weight:700;line-height:1.5;letter-spacing:-.02em;margin:46px 0 0}
.desc{font-size:31px;line-height:1.7;color:#4a4a52;margin:84px auto 0;font-weight:500}
.strip{position:absolute;left:0;right:0;top:760px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent)}
.mt{display:flex;width:max-content;will-change:transform}
.set{display:flex;gap:18px;padding-right:18px;flex:none}
.tile{flex:none;width:480px;height:640px;border-radius:30px;overflow:hidden;background:#f6f6f7}
.tile:nth-child(even){margin-top:50px}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="stage">
  <div class="txt">
    <h1><span>Layered club</span></h1>
    <p class="motto">MOVE AT YOUR OWN PACE.<br>JUST KEEP GOING!</p>
    <p class="desc">레이어드클럽은 지속 가능한 속도로 혼자서 도전하기 어려웠던<br>콘텐츠를 만들고, 오로지 나라는 사람의 브랜드를<br>쌓아가는 크리에이터 커뮤니티예요.</p>
  </div>
  <div class="strip"><div class="mt" id="mt"><div class="set" id="set">
    <div class="tile"><img src="../img/p1.jpg" alt=""></div>
    <div class="tile"><img src="../img/p2.jpg" alt=""></div>
    <div class="tile"><img src="../img/p3.jpg" alt=""></div>
    <div class="tile"><img src="../img/p4.jpg" alt=""></div>
    <div class="tile"><img src="../img/p5.jpg" alt=""></div>
  </div></div></div>
</div>
<script>
/* 롤링을 시간(t, 초)으로 직접 계산해요. LOOP초에 한 세트만큼 이동하므로 처음과 끝이 이음새 없이 이어져요. */
var LOOP = 15, mt = document.getElementById("mt"), set = document.getElementById("set"), W = 0;
function build(){
  W = set.getBoundingClientRect().width;
  var need = Math.ceil(1080 / W) + 1;
  for(var i = 0; i < need; i++){ var c = set.cloneNode(true); c.removeAttribute("id"); mt.appendChild(c); }
}
function setT(t){ mt.style.transform = "translateX(" + (-(t % LOOP) / LOOP * W) + "px)"; }
window.setT = setT; window.LOOP = LOOP;
window.addEventListener("load", function(){ build(); setT(0); window.READY = true; });
</script>
</body>
</html>
